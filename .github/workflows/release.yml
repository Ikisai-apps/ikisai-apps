name: Release
# Por lotes (VG, 27-10-2026): antes, una release por fusión (78 en 24 h). Ahora cada pasada publica, si main cambió desde
# la última release completa (tag ligero `released`), las apps afectadas desde lo que cada una tiene publicado.
# - push a main: espera 10 min antes de mirar main (antirrebote). Con la concurrencia de abajo, las fusiones que llegan
#   mientras tanto se juntan en una sola pasada en espera, que al final no hace nada si ya está todo publicado.
# - cron cada 30 min: red de seguridad. GitHub entrega aquí los `schedule` con horas de retraso (los diarios llegan unas
#   5 h tarde; tras #803 no llegó ninguno en 3 h), así que no basta por sí solo.
# A mano, `workflow_dispatch` como siempre (una app, versión y `bind_domain`).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'MUELA/**', '**.md']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      app:
        description: App a publicar
        required: true
        type: choice
        options: [tasks, invoices, booking, food, central, organizers, guests, flow]
      version:
        description: 'Versión vX.Y.Z[-sufijo] (vacío: v0.1.0-build.<run_number>)'
        required: false
        type: string
      bind_domain:
        description: Enlazar <app>.ikisai.com y su CNAME tras publicar Pages
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# Nunca dos releases a la vez: la nueva espera a la que corre. GitHub deja una sola en espera; si llega otra, la que
# esperaba se cancela y la siguiente pasada recoge lo que quedara.
concurrency:
  group: ikisai-release
  cancel-in-progress: false
jobs:
  plan:
    name: Apps afectadas y versión
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      apps: ${{ steps.matrix.outputs.apps || '[]' }}
      migrations: ${{ steps.matrix.outputs.migrations || 'false' }}
      version: ${{ steps.matrix.outputs.version }}
      # El commit que publica todo el run: los demás jobs lo sacan con `ref`, aunque main avance mientras tanto.
      sha: ${{ steps.last.outputs.sha }}
      released: ${{ steps.last.outputs.released }}
      skip: ${{ steps.last.outputs.skip }}
    steps:
      # Los 10 min se cuentan desde el push, no desde que el run arranca: un run que ha esperado en la cola de la concurrencia
      # (detrás de una publicación) ya ha juntado las fusiones y no vuelve a esperar entero (27-10: el de las 10:18 arrancó a
      # las 10:21, esperó hasta las 10:31 y acabó a las 10:42).
      - name: Esperar a que acaben de llegar las fusiones (antirrebote)
        if: github.event_name == 'push'
        env:
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          pushed=$(date -d "$PUSHED_AT" +%s 2>/dev/null || date +%s)
          left=$(( 600 - ($(date +%s) - pushed) ))
          echo "push: $PUSHED_AT · espera: $(( left > 0 ? left : 0 )) s"
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
      # Fuera de dispatch, main tal como esté ahora (no el commit que disparó el run): recoge lo fusionado en la espera.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'workflow_dispatch' && 'main' || '' }}
          fetch-depth: 0
      - id: last
        name: Última release completa
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          released=$(git rev-parse -q --verify 'refs/tags/released^{commit}' || true)
          skip=false
          if [ "${{ github.event_name }}" != workflow_dispatch ] && [ "$released" = "$sha" ]; then skip=true; fi
          { echo "sha=$sha"; echo "released=$released"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"
          echo "main=$sha  publicado=${released:-ninguno}  saltar=$skip"
      - uses: actions/setup-python@v5
        if: steps.last.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - id: matrix
        if: steps.last.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
          # Sin version.json legible, cada app se compara con la última release completa (antes, con el push).
          BEFORE: ${{ steps.last.outputs.released }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/release_matrix.py | tee -a "$GITHUB_OUTPUT"
  # Sin repetir las comprobaciones: cada PR ya pasó `checks.yml` antes de fusionarse (ahorro de minutos de Actions,
  # 6 oct 2026). Lo que publica cada app lo decide release_matrix comparando con el commit que tiene publicado.
  migraciones:
    name: Migraciones (una vez)
    needs: [plan]
    # También sin apps que publicar si hay migraciones desde la última release (p. ej. solo de Recursos, que no tiene dominio propio).
    if: needs.plan.outputs.apps != '[]' || needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: ikisai-migraciones
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IKISAI_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar las migraciones pendientes una sola vez
        run: python scripts/deploy_supabase_schema.py --apply
  release:
    name: Publicar ${{ matrix.app }}
    needs: [plan, migraciones]
    if: needs.plan.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: ikisai-release-${{ matrix.app }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      APP: ${{ matrix.app }}
      IKISAI_RELEASE: ${{ needs.plan.outputs.version }}
      IKISAI_COMMIT: ${{ needs.plan.outputs.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IKISAI_DEBUG: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Comprobar secretos del entorno production
        run: |
          python - <<'PY'
          import os, sys
          required = ['SUPABASE_ACCESS_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_ZONE_ID', 'CLOUDFLARE_API_TOKEN']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print('Faltan secretos de Actions: ' + ', '.join(missing)); sys.exit(1)
          PY
      - name: Publicar y verificar la versión exacta
        run: |
          EXTRA=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.bind_domain }}" = "true" ]; then EXTRA="--bind-domain"; fi
          python scripts/release_cloud.py --app "$APP" --version "$IKISAI_RELEASE" --apply --skip-schema $EXTRA
      - name: Subir el catálogo de funcionalidades (perspectiva «Uso» del Revisor)
        run: |
          node packages/ui-kit/scripts/feature-catalog.mjs --app "$APP" --release "$IKISAI_RELEASE" --commit "$IKISAI_COMMIT" || echo "sin catálogo para $APP"
          python scripts/usage_catalog_ingest.py --app "$APP" --release "$IKISAI_RELEASE" --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.app }}-${{ github.run_id }}
          path: private/release-${{ matrix.app }}.json
          retention-days: 90
          if-no-files-found: warn
  feedback:
    name: Reportes de feedback publicados
    needs: [plan, release]
    # Los códigos FB de los commits entre la última release completa y esta.
    if: github.event_name != 'workflow_dispatch' && needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pasar a «pendiente de verificar» los reportes con su código en los commits publicados
        env:
          BEFORE: ${{ needs.plan.outputs.released }}
          BUILD: ${{ needs.plan.outputs.version }}
        run: python scripts/feedback_mark_released.py --since "$BEFORE" --build "$BUILD" --apply
  publicado:
    name: Marcar lo publicado
    needs: [plan, migraciones, release]
    # Solo en la pasada por lotes (push o cron) y si todo lo que tocaba salió bien, o no hacía falta: el tag `released` pasa al commit
    # publicado. Si algo falla, no se mueve y la siguiente pasada lo reintenta; lo ya publicado no se repite, porque
    # release_matrix mira el version.json de cada app. A mano (una sola app), no se mueve.
    if: >-
      always() && github.event_name != 'workflow_dispatch' && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
      && (needs.migraciones.result == 'success' || needs.migraciones.result == 'skipped')
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Tag ligero `released` en el commit publicado
        run: git push --force origin "${{ needs.plan.outputs.sha }}:refs/tags/released"

name: Encrypted daily backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ikisai-cloud-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IKISAI_BACKUP_KEY: ${{ secrets.IKISAI_BACKUP_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-backup.txt
      - name: Crear y verificar el backup cifrado
        id: backup
        run: python scripts/encrypted_backup.py create --skip-unchanged --output private/IkisaiApps-${{ github.run_id }}.ikisai
      - uses: actions/upload-artifact@v4
        if: steps.backup.outputs.created == 'true'
        with:
          name: encrypted-IkisaiApps-${{ steps.backup.outputs.fingerprint }}-${{ github.run_id }}
          path: private/*.ikisai
          retention-days: 90
          if-no-files-found: error

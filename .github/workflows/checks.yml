name: Checks
on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'CODEOWNERS']
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cambios:
    name: Qué ha cambiado
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files="__todo__"
          fi
          if [ "$files" = "__todo__" ] || echo "$files" | grep -Eq '^(apps/|packages/|tests/(invoices|booking|food|tasks)/|playwright\.config\.ts|package\.json|package-lock\.json|\.github/)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Archivos: $(echo "$files" | wc -l)  frontend=$(tail -1 "$GITHUB_OUTPUT")"
  core:
    name: Lint de migraciones, typecheck y pruebas PGlite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
  e2e:
    name: Playwright (solo si existe playwright.config.ts)
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end
        if: hashFiles('playwright.config.ts') != ''
        run: npm run test:e2e
      - name: Pruebas del ui-kit
        if: hashFiles('packages/ui-kit/tests/playwright.config.ts') != ''
        run: npm run test:ui-kit
      - name: Sin configuración de Playwright
        if: hashFiles('playwright.config.ts') == ''
        run: echo "playwright.config.ts no existe todavía; se omite la suite e2e"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('playwright.config.ts') != ''
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

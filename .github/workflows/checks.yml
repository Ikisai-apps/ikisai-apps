name: Checks
on:
  pull_request:
    branches: [main]
    # Sin `ready_for_review`: la PR en borrador ya corrió al abrirse y en cada push; quitar el borrador repetía toda la CI
    # (20–30 min por PR con la cola llena, 26-10-2026). Las comprobaciones del SHA siguen valiendo para la fusión.
    types: [opened, synchronize, reopened]
    # Sin filtro de rutas: con main protegida (14-10-2026) las comprobaciones obligatorias tienen que informar siempre.
    # En una PR solo de documentación, «Qué ha cambiado» decide `code=false`: lo pesado queda saltado y la puerta
    # «Lint de migraciones, typecheck y pruebas PGlite» sale verde sin correr nada.
  workflow_call:
  # Completa cada noche (solo si main cambió en las últimas 24 h) y a mano: en las PR, de lo compartido solo va el humo.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # En PR, una ejecución por rama (la nueva cancela la vieja). Llamado desde la release (push a main), un grupo por
  # ejecución: si no, cada push pendiente cancelaba al anterior durante las comprobaciones y casi nunca se publicaba.
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cambios:
    name: Qué ha cambiado
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.detect.outputs.e2e }}
      uikit: ${{ steps.detect.outputs.uikit }}
      prefijos: ${{ steps.detect.outputs.prefijos }}
      code: ${{ steps.detect.outputs.code }}
      pglite: ${{ steps.detect.outputs.pglite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          # Salida: matriz JSON [{app, grep}] para Playwright, un job por app en paralelo.
          #  · App tocada (su código, su API, su dominio, sus pruebas o sus migraciones): su suite completa.
          #  · Algo compartido (kit, sync-client, test-kit, _kit, CI, scripts, dependencias): solo las pruebas @smoke de
          #    cada app (la app que aún no tiene ninguna, completa). La suite entera de todas corre de noche.
          # PGlite: scripts/ci_plan.mjs decide `pglite` (grupos de carpetas de tests/: la app tocada y las que dependen de
          # ella; con algo compartido o fuera de una PR, todas) y `code` (false en una PR solo de docs/, MUELA/, CODEOWNERS
          # o *.md: sin npm ci, sin PGlite y sin Playwright; solo esta detección y la puerta).
          apps="invoices booking food tasks central organizers guests flow"
          full=""; smoke=false; uikit=false; prefijos=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            echo "$files" | node scripts/ci_plan.mjs --event pull_request
            if echo "$files" | grep -Eq '^(packages/(sync-client|ui-kit|test-kit)/|supabase/functions/_kit/|playwright\.config\.ts|package\.json|package-lock\.json|\.github/|scripts/)'; then smoke=true; fi
            if echo "$files" | grep -Eq '^(packages/ui-kit/|package-lock\.json)'; then uikit=true; fi
            # CSS o HTML de una app: solo la prueba de prefijos de clases del kit (v45), para que un choque con el kit salga
            # en la PR de la app y no en la siguiente del kit. Si corre la suite del kit, ya va dentro.
            if [ "$uikit" = false ] && echo "$files" | grep -Eq '^apps/[^/]+/.*\.(css|html)$'; then prefijos=true; fi
            # Historia, cáscara (con el menú lateral), hojas, diálogos, paleta y avisos del kit («atrás», FB_2026_025): cambian
            # el recorrido de todas las apps, así que corre la batería completa de cada una, no solo el humo (regresión de la
            # 0.27.1 en Booking).
            if echo "$files" | grep -Eq '^packages/ui-kit/src/(shell/(back-navigation|app-shell|workspace)|overlay/(sheet|dialog)|palette|toast)\.ts$'; then full="$apps"; fi
            for app in $apps; do
              if echo "$files" | grep -Eq "^(apps/$app/|supabase/functions/$app-api/|supabase/functions/_domain/$app/|packages/domain-$app/|tests/$app/|supabase/migrations/[0-9_]+_${app}_)"; then full="$full $app"; fi
            done
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "Sin cambios en main desde ayer: nada que probar"
            printf 'code=false\npglite=[]\n' >> "$GITHUB_OUTPUT"
          else
            full="$apps"; uikit=true
            node scripts/ci_plan.mjs --event "${{ github.event_name }}" < /dev/null
          fi
          code=$(grep -E '^code=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          # Sin código, ningún Playwright (una PR solo de documentación).
          [ "$code" = true ] || { full=""; smoke=false; }
          items=""
          for app in $apps; do
            [ -n "$(find tests/$app -name '*.spec.ts' 2>/dev/null | head -1)" ] || continue
            grep=""
            if echo " $full " | grep -q " $app "; then :
            elif [ "$smoke" = true ]; then
              grep -rq "@smoke" tests/$app && grep="@smoke"
            else continue; fi
            items="$items{\"app\":\"$app\",\"grep\":\"$grep\"},"
          done
          echo "e2e=[${items%,}]" >> "$GITHUB_OUTPUT"
          echo "uikit=$uikit" >> "$GITHUB_OUTPUT"
          echo "prefijos=$prefijos" >> "$GITHUB_OUTPUT"
          echo "Archivos: $(echo "${files:-}" | wc -l)  e2e=[${items%,}]  uikit=$uikit  prefijos=$prefijos  code=$code"
  lint:
    name: Lint de migraciones y typecheck
    needs: cambios
    # Saltado solo en una PR de documentación. El typecheck es entero siempre (≈1 min, en paralelo con PGlite).
    if: needs.cambios.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Pruebas de los scripts de operación (Python)
        run: python3 -m unittest discover -s tests/scripts
  pglite:
    name: PGlite · ${{ matrix.name }}
    needs: cambios
    if: needs.cambios.outputs.code == 'true' && needs.cambios.outputs.pglite != '[]'
    runs-on: ubuntu-24.04
    # Un job por carpeta grande (las pequeñas juntas): el tiempo es el de la más lenta, no la suma de las nueve apps.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cambios.outputs.pglite) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/run_tests.mjs ${{ matrix.folders }}
  core:
    # Comprobación obligatoria de main (ruleset): mismo nombre de siempre, ahora como puerta de «lint» y de la matriz
    # «pglite». Verde si todo lo que tocaba pasó; en una PR solo de documentación, verde sin correr nada.
    name: Lint de migraciones, typecheck y pruebas PGlite
    needs: [cambios, lint, pglite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          echo "cambios=${{ needs.cambios.result }}  lint=${{ needs.lint.result }}  pglite=${{ needs.pglite.result }}  code=${{ needs.cambios.outputs.code }}"
          [ "${{ needs.cambios.result }}" = success ] || { echo "«Qué ha cambiado» no terminó bien"; exit 1; }
          [ "${{ needs.cambios.outputs.code }}" = true ] || { echo "Solo documentación: nada que probar"; exit 0; }
          [ "${{ needs.lint.result }}" = success ] || { echo "Lint de migraciones o typecheck: ${{ needs.lint.result }}"; exit 1; }
          [ "${{ needs.pglite.result }}" = success ] || { echo "Pruebas PGlite: ${{ needs.pglite.result }}"; exit 1; }
  e2e:
    name: Playwright · ${{ matrix.app }}${{ matrix.grep && ' (humo)' || '' }}
    needs: cambios
    if: needs.cambios.outputs.e2e != '[]'
    runs-on: ubuntu-24.04
    # Un job por app: el tiempo total es el de la app más lenta, no la suma. Si una app supera esto, se parte su suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cambios.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end de ${{ matrix.app }}
        shell: bash
        run: |
          # --retries=2: una prueba que falla por tiempos y pasa al repetir queda marcada «flaky», no tumba la CI.
          # --workers=2: cada archivo levanta su servidor en un puerto libre; el runner tiene 4 núcleos.
          npx playwright test tests/${{ matrix.app }} --retries=2 --workers=2 ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.app }}-${{ github.run_id }}-intento-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
  prefijos:
    name: Prefijos de clases (kit, v45)
    needs: cambios
    if: needs.cambios.outputs.prefijos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm -w @ikisai/ui-kit run test:e2e -- v45 --project=escritorio
  uikit:
    name: Pruebas del ui-kit · ${{ matrix.shard }}/3
    needs: cambios
    if: needs.cambios.outputs.uikit == 'true'
    runs-on: ubuntu-24.04
    # La suite del kit pasa ya de 10 min seguida: tres trozos en paralelo (Playwright --shard).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm -w @ikisai/ui-kit run test:e2e -- --shard=${{ matrix.shard }}/3

name: Checks
on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'CODEOWNERS']
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cambios:
    name: Qué ha cambiado
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      e2e: ${{ steps.detect.outputs.e2e }}
      uikit: ${{ steps.detect.outputs.uikit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files="__todo__"
          fi
          frontend=false; e2e=""; uikit=false
          if [ "$files" = "__todo__" ] || echo "$files" | grep -Eq '^(packages/(sync-client|ui-kit|test-kit)/|supabase/functions/_kit/|playwright\.config\.ts|package\.json|package-lock\.json|\.github/|scripts/)'; then
            # Algo compartido (o push a main): Playwright de todas las apps y del kit.
            frontend=true; e2e="all"; uikit=true
          else
            for app in invoices booking food tasks; do
              if echo "$files" | grep -Eq "^(apps/$app/|supabase/functions/$app-api/|supabase/functions/_domain/$app/|packages/domain-$app/|tests/$app/|supabase/migrations/[0-9_]+_${app}_)"; then
                frontend=true; e2e="$e2e tests/$app"
              fi
            done
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "e2e=${e2e# }" >> "$GITHUB_OUTPUT"
          echo "uikit=$uikit" >> "$GITHUB_OUTPUT"
          echo "Archivos: $(echo "$files" | wc -l)  frontend=$frontend  e2e='${e2e# }'  uikit=$uikit"
  core:
    name: Lint de migraciones, typecheck y pruebas PGlite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
  e2e:
    name: Playwright (solo si existe playwright.config.ts)
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end (solo las apps afectadas; todas si cambia algo compartido)
        if: hashFiles('playwright.config.ts') != '' && needs.cambios.outputs.e2e != ''
        shell: bash
        run: |
          if [ "${{ needs.cambios.outputs.e2e }}" = "all" ]; then npm run test:e2e; else npx playwright test ${{ needs.cambios.outputs.e2e }}; fi
      - name: Pruebas del ui-kit
        if: hashFiles('packages/ui-kit/tests/playwright.config.ts') != '' && needs.cambios.outputs.uikit == 'true'
        run: npm run test:ui-kit
      - name: Sin configuración de Playwright
        if: hashFiles('playwright.config.ts') == ''
        run: echo "playwright.config.ts no existe todavía; se omite la suite e2e"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('playwright.config.ts') != ''
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

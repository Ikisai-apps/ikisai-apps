<style>
:root{
  --bg:#f3eee4; --paper:#fffaf1; --paper-2:#f9f3e9; --ink:#263129; --muted:#746f65;
  --line:#ded5c8; --olive:#68704a; --olive-dark:#46513b; --terracotta:#c87847; --shadow:0 10px 28px rgba(55,44,32,.10);
  --radius:20px; --tap:46px;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer}
body{min-height:100dvh}
#app{max-width:760px;margin:0 auto;min-height:100dvh;background:linear-gradient(180deg,#f8f2e8 0,#f3eee4 45%,#eee7db 100%);position:relative;padding-bottom:92px}

.mark{width:34px;height:34px;border-radius:12px;background:var(--olive-dark);color:#f7f0e3;display:grid;place-items:center;font-weight:800;letter-spacing:-2px}.iconbtn{border:0;background:transparent;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px}.iconbtn:hover{background:rgba(70,81,59,.07)}

.screen{padding:16px}.screenhead{display:flex;align-items:flex-start;gap:12px;margin:2px 0 15px}.title{font-family:Georgia,serif;font-size:29px;line-height:1.05;margin:0}.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}.head-actions{display:flex;gap:6px;margin-left:auto}
.searchbar{display:flex;gap:9px;margin:8px 0 14px}.searchbar input{flex:1;border:1px solid var(--line);background:var(--paper);height:46px;border-radius:15px;padding:0 14px;outline:none}.softbtn{border:1px solid var(--line);background:var(--paper);min-width:46px;height:46px;border-radius:15px;padding:0 13px;font-weight:700}.softbtn.active{background:#e8e0d3;border-color:#c7b9a6}
.sectionlabel{display:flex;align-items:center;gap:8px;margin:18px 2px 9px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#777063}.sectionlabel .count{background:#e5ddcf;border-radius:999px;padding:2px 7px;letter-spacing:0}
.project-grid{display:grid;grid-template-columns:1fr;gap:11px}.newproject{background:rgba(255,250,241,.94);border:1px solid #e0d7ca;border-radius:20px;padding:15px;box-shadow:0 3px 10px rgba(55,44,32,.04)}.progressline{height:6px;background:#e7dfd2;border-radius:999px;margin:13px 0 11px;overflow:hidden}.progressline span{display:block;height:100%;background:var(--olive);border-radius:inherit}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750;color:#fff;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}.chip .x{opacity:.75}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:rgba(255,250,241,.6);border:1px dashed var(--line);border-radius:20px}
.fab{position:fixed;z-index:28;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:84px;width:58px;height:58px;border-radius:20px;border:0;background:var(--terracotta);color:#fff;font-size:30px;box-shadow:0 12px 25px rgba(118,67,38,.24)}

.back{border:0;background:transparent;padding:0 8px 0 0;font-size:25px}.project-detail-head{display:flex;align-items:center}.detail-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:13px}.bigprogress{display:flex;align-items:center;gap:12px}.ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--olive) var(--p),#e5ddd0 0);position:relative;font-weight:800;font-size:12px}.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--paper)}.ring span{position:relative}.tasklist{display:flex;flex-direction:column;gap:8px}.task{display:flex;gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:12px;align-items:flex-start}.task.done{opacity:.58}.check{width:25px;height:25px;min-width:25px;border:2px solid #a99d8a;border-radius:8px;background:#fff;display:grid;place-items:center;margin-top:1px}.task.done .check{background:var(--olive);border-color:var(--olive);color:#fff}.taskbody{flex:1;min-width:0}.tasktext{font-weight:750;line-height:1.3}.task.done .tasktext{text-decoration:line-through}.tasknote{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.taskchips{margin-top:8px}.taskmeta{font-size:12px;color:#8c8174;margin-top:8px;display:flex;gap:9px;flex-wrap:wrap}.taskmenu{border:0;background:transparent;font-size:19px;color:#8a8176;padding:1px 4px}
.sheettitle{font-family:Georgia,serif;font-size:24px;margin:0 0 13px}.field{margin:13px 0}.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:#766e64;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;height:46px;border-radius:14px;padding:10px 12px;outline:none}.field textarea{height:90px;resize:vertical}.row{display:flex;gap:9px}.row>*{flex:1}.primary{border:0;background:var(--olive-dark);color:#fff;height:48px;padding:0 18px;border-radius:15px;font-weight:800}.danger{border:0;background:#f1dfd8;color:#8a442d;height:46px;padding:0 16px;border-radius:14px;font-weight:800}.actions{display:flex;gap:9px;margin-top:18px}.actions .primary{flex:1}
.family{padding:12px 0;border-top:1px solid #e7ded2}.family:first-of-type{border-top:0}.familyhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}.dot{width:13px;height:13px;border-radius:50%}.familyname{font-weight:800}.suggestion{display:flex;align-items:center;justify-content:space-between;padding:9px 0}.suggestion button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 10px;font-weight:700}.muted{color:var(--muted)}
.filter-summary{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.filterfamily{margin:15px 0}.filterfamily h4{margin:0 0 7px;font-size:13px}.filterchip{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;margin:0 5px 6px 0}.filterchip.on{box-shadow:inset 0 0 0 2px currentColor;font-weight:800}
.label-manager .family-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}.family-card-head{display:flex;align-items:center;gap:9px}.family-card .chips{margin-top:10px}.small{font-size:12px}.ghost{border:1px dashed #cfc3b2;background:transparent;border-radius:12px;padding:8px 10px;font-weight:750;color:#756d62}.colorpick{width:32px;height:32px;border:0;border-radius:9px;background:transparent;padding:0;overflow:hidden}.toast{position:fixed;z-index:100;left:50%;bottom:85px;transform:translateX(-50%) translateY(15px);background:#2f382f;color:#fff;padding:10px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{font-size:12px;color:#746d63;background:#eee6da;border-radius:12px;padding:9px 11px;margin-bottom:12px}.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c87847;margin-right:6px}
@media(min-width:640px){.project-grid{grid-template-columns:1fr 1fr}.screen{padding:20px 24px}.fab{bottom:92px}}
/* P5A v2 · filas compactas con objetivos táctiles independientes */

.screen{padding:14px 12px}.title{font-size:25px}.searchbar input{min-width:0;font-size:16px}.row>*{min-width:0}
.tasklist{gap:0;border:1px solid var(--line);border-radius:15px;background:var(--paper);overflow:visible}
.task{position:relative;gap:0;border:0;border-bottom:1px solid #ebe3d7;border-radius:0;padding:5px 3px;min-height:52px;align-items:flex-start;background:transparent}.task:last-child{border-bottom:0}.task.child{margin-left:24px;border-left:2px solid #d9d5c4;padding-left:3px}.task.done{opacity:1}.task.done .taskbody{opacity:.6}.task.context{background:#f4efe5}
.draghandle{width:24px;min-width:24px;height:44px;border:0;background:transparent;color:#a39a8b;font-size:21px;touch-action:none;cursor:grab;padding:0}
.check{margin:0;width:38px;min-width:38px;height:44px;border:0;border-radius:0;background:transparent!important;position:relative;font-size:17px;color:var(--olive-dark)!important;z-index:1}.check:before{content:'';position:absolute;left:9px;top:12px;width:19px;height:19px;border:1.6px solid #9c998a;border-radius:5px;z-index:-1}.task.done .check:before{background:#dfe5d6;border-color:var(--olive)}.check.mixed:before{background:#e9e9dc;border-color:var(--olive)}
.taskbody{text-align:left;display:block;border:0;background:transparent;padding:7px 4px 6px;min-width:0}.tasktext{font-size:14px;line-height:1.35;font-weight:600;display:block;overflow-wrap:anywhere}.tasknote{font-size:11px;line-height:1.3;margin:2px 0 0;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.taskchips{gap:3px;margin-top:4px}.taskchips:empty{display:none}.taskchips .chip{font-size:9px;padding:3px 6px;font-weight:650}.taskmeta{font-size:10px;margin-top:4px;gap:8px}.taskmenu{height:44px;width:30px;min-width:30px;padding:0}.priority{color:#a94c32}.projectnote{font-size:12px;line-height:1.4;margin-bottom:8px}.projectdetails{font-size:11px;color:var(--muted);margin:8px 0}.projectdetails summary{cursor:pointer;padding:5px 0}.projectdetails .chips{margin-top:6px}.sectionlabel{margin:12px 2px 8px}.sectionlabel .ghost{margin-left:auto;padding:5px 8px;text-transform:none;letter-spacing:0;font-size:10px}
.quickadd{width:100%;text-align:left;padding:14px 18px;border:0;background:transparent;color:var(--olive-dark);font-size:14px}.rootdrop{display:none;padding:18px;border:2px dashed var(--olive);border-radius:12px;font-size:12px;text-align:center;margin-top:12px}.dragging .rootdrop{display:block}.dragging{user-select:none}.drag-source{opacity:.35}.drop-before{box-shadow:0 -3px 0 var(--olive)}.drop-after{box-shadow:0 3px 0 var(--olive)}.drop-child{background:#e4eadc!important;outline:2px solid var(--olive);outline-offset:-2px}.drop-child:after{content:'↳ Hacer hija';position:absolute;right:5px;bottom:0;font-size:10px;color:var(--olive-dark);background:#e4eadc}.drop-project{background:#e0e8d6!important;outline:2px solid var(--olive)}
#dragGhost{position:fixed;z-index:90;pointer-events:none;width:210px;background:var(--olive-dark);color:white;border-radius:10px;padding:12px;font-size:12px;box-shadow:var(--shadow);opacity:.93}
#moveRail{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(760px,100%);z-index:80;background:var(--paper);padding:10px 12px;box-shadow:var(--shadow)}#moveRail>span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}#moveRail>div{display:flex;gap:6px;overflow-x:auto;padding:4px}#moveRail button{white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;font-size:12px}
.menulist{display:grid;gap:5px}.menulist button{border:0;background:var(--paper-2);border-radius:12px;min-height:46px;text-align:left;padding:12px}.projectlink{border:0;background:transparent;font:inherit;color:var(--olive-dark);padding:4px 0;text-align:left}.archivedchip{opacity:.45;text-decoration:line-through}.chip{border:0}.project-grid{gap:9px}.newproject{padding:12px}.notice{margin-top:4px;font-size:11px}.field label{font-size:11px}.sheet input,.sheet select,.sheet textarea{font-size:16px}.actions{position:sticky;bottom:0;background:var(--paper);padding:8px 0}#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}.fab{bottom:calc(82px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:17px}.suggestion{gap:8px}.suggestion span{overflow-wrap:anywhere;min-width:0}.suggestion button{flex-shrink:0}.project-detail-head .title{overflow-wrap:anywhere}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
@media(min-width:640px){.screen{padding:18px 24px}.task.child{margin-left:30px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


.brandrow .syncbadge{font-size:10px;line-height:1.2;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);max-width:115px}.brandrow .syncbadge[data-mode=conflict],.brandrow .syncbadge[data-mode=error]{color:#9d452d;border-color:#c87847}.boot{padding:40px 20px}.conflictitem{padding:12px;background:var(--paper-2);margin:8px 0;border-radius:12px;overflow-wrap:anywhere}.conflictitem p{font-size:12px}button:disabled{opacity:.45;cursor:default}#app[data-readonly=true] .draghandle{visibility:hidden}

<body>
<div id="app"></div>
<div id="sheetBack" hidden></div>
<div id="toast" class="toast"></div>
<script>
const FAMILY_DEFAULTS=[
 {id:'person',name:'Persona',color:'#6f5a8f'},
 {id:'trade',name:'Oficio',color:'#b76b3d'},
 {id:'phase',name:'Fase',color:'#6b7b54'},
 {id:'building',name:'Edificio',color:'#4e6f72'},
 {id:'space',name:'Espacio',color:'#9c744e'}
];
const demo={
 activeTab:'ikisai', view:'projects', currentProject:null, search:'', filters:{},
 tabs:[
  {id:'ikisai',name:'Ikisai',families:structuredClone(FAMILY_DEFAULTS),labels:[
    ['vg','VG','person'],['juan','Juan','person'],['prof','Profesional','person'],
    ['font','Fontanería','trade'],['elec','Electricidad','trade'],['carp','Carpintería','trade'],['limp','Limpieza','trade'],['obra','Obra','trade'],
    ['apertura','Apertura','phase'],['mejora','Mejora','phase'],
    ['albergue','Albergue','building'],['centro','Centro','building'],['exterior','Exteriores','building'],
    ['cocina','Cocina','space','albergue'],['bano','Baños','space','albergue'],['sala','Sala principal','space','centro'],['piscina','Piscina','space','exterior']
  ].map(([id,text,family,parent])=>({id,text,family,parent:parent||null,archived:false})),projects:[
    {id:'inbox',system:'inbox',title:'Entrada',note:'Captura rápida. Clasificar después.',status:'active',priority:'normal',due:'',ownLabels:[],tasks:[
      {id:'t0',text:'Revisar cierre de la puerta exterior',note:'Sin clasificar todavía.',done:false,priority:'normal',due:'',labels:['vg'],owner:'vg'}
    ]},
    {id:'p1',title:'Edificio inferior',note:'Dejar las salas listas para uso de grupos.',status:'active',priority:'high',due:'2026-10-20',ownLabels:['centro','apertura'],tasks:[
      {id:'t1',text:'Sustituir puerta dañada',note:'Revisar marco antes de montar la nueva.',done:false,priority:'high',due:'2026-10-10',labels:['carp','juan','centro','apertura'],owner:'juan'},
      {id:'t2',text:'Activar agua fría',note:'Comprobar presión al final del recorrido.',done:false,priority:'critical',due:'2026-10-08',labels:['font','prof','centro','apertura'],owner:'prof'},
      {id:'t3',text:'Desmontar elementos colgados',note:'Guardar lo reutilizable.',done:true,priority:'normal',due:'',labels:['obra','vg','centro'],owner:'vg'},
      {id:'t4',text:'Limpieza a fondo de salas',note:'Hacer después de terminar los trabajos sucios.',done:false,priority:'normal',due:'2026-10-18',labels:['limp','centro','apertura'],owner:null}
    ]},
    {id:'p2',title:'Cocina operativa',note:'Cierre de compras y pequeñas reparaciones.',status:'active',priority:'normal',due:'2026-10-15',ownLabels:['albergue','cocina','apertura'],tasks:[
      {id:'t5',text:'Revisar enchufes de maquinaria',note:'Priorizar zona de preparación.',done:true,priority:'high',due:'',labels:['elec','prof','albergue','cocina'],owner:'prof'},
      {id:'t6',text:'Sellar pequeños agujeros de tapetas',note:'Acabado antracita.',done:false,priority:'normal',due:'',labels:['carp','vg','albergue','cocina'],owner:'vg'},
      {id:'t7',text:'Comprobar desagües antes del primer retiro',note:'Prueba con varios puntos de consumo a la vez.',done:false,priority:'high',due:'2026-10-12',labels:['font','albergue','cocina','apertura'],owner:null}
    ]},
    {id:'p3',title:'Piscina y exteriores',note:'Trabajos no bloqueantes de mejora.',status:'paused',priority:'normal',due:'',ownLabels:['exterior','mejora'],tasks:[
      {id:'t8',text:'Revisar junta perimetral',note:'Documentar con fotos.',done:false,priority:'normal',due:'',labels:['obra','exterior','piscina','mejora'],owner:null},
      {id:'t9',text:'Ordenar herramientas de mango largo',note:'Solución vertical sencilla.',done:true,priority:'normal',due:'',labels:['vg','exterior'],owner:'vg'}
    ]}
  ]},
  {id:'personal',name:'Personal',families:structuredClone(FAMILY_DEFAULTS),labels:[['vgp','VG','person'],['casa','Casa','building'],['familia','Familia','phase']].map(([id,text,family])=>({id,text,family,archived:false,parent:null})),projects:[{id:'pp1',title:'Casa',note:'Ejemplo de pestaña independiente.',status:'active',priority:'normal',due:'',ownLabels:['casa'],tasks:[{id:'pt1',text:'Comprar bombillas',note:'',done:false,priority:'normal',due:'',labels:['vgp','casa'],owner:'vgp'}]}]},
  {id:'detailorg',name:'Detailorg',families:structuredClone(FAMILY_DEFAULTS),labels:[],projects:[]}
 ]
};
let state=load();
function load(){try{const x=localStorage.getItem('ikisai_p5a_demo');return x?JSON.parse(x):structuredClone(demo)}catch(e){return structuredClone(demo)}}
function save(){localStorage.setItem('ikisai_p5a_demo',JSON.stringify(state))}
function tab(){return state.tabs.find(t=>t.id===state.activeTab)}
function project(){return tab().projects.find(p=>p.id===state.currentProject)}
function family(id){return tab().families.find(f=>f.id===id)}
function label(id){return tab().labels.find(l=>l.id===id)}
function familyColorByLabel(id){const l=label(id);const f=l&&family(l.family);return f?f.color:'#777'}
function chips(ids=[]){return ids.map(id=>{const l=label(id);if(!l||l.archived)return'';return `<span class="chip" style="background:${familyColorByLabel(id)}">${esc(labelName(l))}</span>`}).join('')}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function progress(p){const a=p.tasks.filter(t=>!t.deleted);if(!a.length)return 0;return Math.round(a.filter(t=>t.done).length/a.length*100)}
function aggregatedLabels(p){const set=new Set(p.ownLabels||[]);p.tasks.filter(t=>!t.deleted).forEach(t=>(t.labels||[]).forEach(x=>set.add(x)));return [...set]}
function filteredTasks(p){let items=p.tasks.filter(t=>!t.deleted);const st=state.filters?._state||[];if(st.length){items=items.filter(t=>(st.includes('pending')&&!t.done)||(st.includes('done')&&t.done))}const q=(state.search||'').trim().toLowerCase();if(q)items=items.filter(t=>(t.text+' '+t.note).toLowerCase().includes(q)||(t.labels||[]).some(id=>(label(id)?.text||'').toLowerCase().includes(q)));
 Object.entries(state.filters||{}).forEach(([fid,ids])=>{if(fid==='_state')return;if(ids?.length)items=items.filter(t=>ids.some(id=>(t.labels||[]).includes(id)))});return items}
function filteredProjects(){let items=tab().projects.filter(p=>!p.deleted&&p.status!=='archived');const q=(state.search||'').trim().toLowerCase();if(q)items=items.filter(p=>p.title.toLowerCase().includes(q)||p.tasks.some(t=>!t.deleted&&(t.text+' '+t.note).toLowerCase().includes(q))||aggregatedLabels(p).some(id=>(label(id)?.text||'').toLowerCase().includes(q)));
 if(Object.values(state.filters||{}).some(x=>x?.length)) items=items.filter(p=>filteredTasks(p).length>0);return items}
/* La cáscara se monta una vez y se actualiza sin repintarse (shell-ui.js); cada render() solo repinta #view. */
function render(){shellUpdate();document.getElementById('view').innerHTML=main()+fab();bind();}
function mainV1(){if(state.view==='project')return projectView();if(state.view==='labels')return labelsView();if(state.view==='inbox'){const p=tab().projects.find(x=>x.system==='inbox');if(p){state.currentProject=p.id;return projectView(true)}}return projectsView()}
function projectsView(){const ps=filteredProjects();return `<main class="screen"><div class="screenhead"><div><h1 class="title">${esc(tab().name)}</h1><p class="subtitle">${tab().projects.filter(p=>!p.deleted&&p.status!=='archived').length} proyectos · ${tab().projects.filter(p=>!p.deleted&&p.status!=='archived').reduce((sum,p)=>sum+pending(p),0)} tareas pendientes</p></div></div>${searchbar()}<div class="notice"><span class="statusdot"></span>Tus tareas y proyectos</div><div class="sectionlabel">Proyectos <span class="count">${ps.length}</span></div><div class="project-grid">${ps.length?ps.map(projectCard).join(''):`<div class="empty">No hay proyectos que coincidan con la vista actual.</div>`}</div></main>`}
function searchbar(){const n=Object.values(state.filters||{}).flat().length;return `<div class="searchbar"><input id="searchInput" type="search" name="tasks-search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="Buscar tareas, proyectos o etiquetas…" value="${esc(state.search||'')}" data-feedback-id="tasks.busqueda.campo" data-feedback-label="Buscar"><button class="softbtn ${n?'active':''}" id="filterBtn" aria-label="Filtros${n?` · ${n} activos`:''}" data-feedback-id="tasks.busqueda.filtros" data-feedback-label="Filtros"><svg class="menuicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18 M6 12h12 M10 19h4"/></svg>${n?` <span class="filter-count">${n}</span>`:''}</button></div>${n?`<div class="filter-summary">${Object.entries(state.filters).flatMap(([k,v])=>k==='_availability'?'':k==='_state'?(v||[]).map(x=>`<span class="chip" style="background:#6f746d">${x==='pending'?'Pendientes':'Completadas'}</span>`):(v||[]).map(id=>chips([id]))).join('')}<button class="ghost" id="clearFilters" data-feedback-id="tasks.busqueda.limpiar_filtros" data-feedback-label="Limpiar filtros">Limpiar</button></div>`:''}`}
function projectView(inbox=false){const p=project();if(!p){state.view='projects';return projectsView()}const tasks=filteredTasks(p),pr=progress(p);return `<main class="screen"><div class="project-detail-head"><button class="back" id="backBtn" data-feedback-id="tasks.proyecto.cabecera.volver" data-feedback-label="Volver">‹</button><div><h1 class="title">${esc(p.title)}</h1><p class="subtitle">${p.status==='paused'?'Pausado · ':''}${p.tasks.filter(t=>!t.deleted).length} tareas</p></div><div class="spacer"></div><button class="iconbtn" data-edit-project="${p.id}" data-feedback-id="tasks.proyecto.cabecera.editar" data-feedback-label="Editar proyecto">⋮</button></div><div class="detail-card"><div class="bigprogress"><div class="ring" style="--p:${pr}%"><span>${pr}%</span></div><div><strong>${p.tasks.filter(t=>!t.deleted&&t.done).length} de ${p.tasks.filter(t=>!t.deleted).length}</strong><div class="muted small">tareas completadas</div></div></div>${p.note?`<p class="subtitle" style="margin-top:12px">${esc(p.note)}</p>`:''}<div class="chips" style="margin-top:10px">${chips(aggregatedLabels(p))}</div></div>${searchbar()}<div class="sectionlabel">Tareas <span class="count">${tasks.length}</span></div><div class="tasklist">${tasks.length?tasks.map(taskRow).join(''):`<div class="empty">No hay tareas que coincidan con la vista.</div>`}</div></main>`}
function taskRow(t){const pri=t.priority==='critical'?'Crítica':t.priority==='high'?'Alta':'';return `<article class="task ${t.done?'done':''}" data-feedback-id="tasks.proyecto.tareas.fila" data-feedback-label="Tarea"><button class="check" data-toggle-task="${t.id}" data-feedback-id="tasks.proyecto.tareas.completar" data-feedback-label="Completar tarea">${t.done?'✓':''}</button><div class="taskbody" data-edit-task="${t.id}" data-feedback-id="tasks.proyecto.tareas.abrir" data-feedback-label="Abrir tarea"><div class="tasktext">${esc(t.text)}</div>${t.note?`<div class="tasknote">${esc(t.note)}</div>`:''}<div class="chips taskchips">${chips(t.labels||[])}</div><div class="taskmeta">${pri?`<span>● ${pri}</span>`:''}${t.due?`<span>◷ ${fmtDate(t.due)}</span>`:''}</div></div><button class="taskmenu" data-edit-task="${t.id}" data-feedback-id="tasks.proyecto.tareas.opciones" data-feedback-label="Opciones de la tarea">⋮</button></article>`}
function labelsView(){return `<main class="screen label-manager"><div class="screenhead"><div><h1 class="title">Etiquetas</h1><p class="subtitle">Catálogo de ${esc(tab().name)}. El color identifica la familia.</p></div></div><div class="notice">Las familias vacías no se muestran en proyectos ni tareas. Aquí sí aparecen porque este es el editor.</div>${tab().families.map(f=>familyCard(f)).join('')}<button class="primary" id="newFamily" style="width:100%;margin-top:10px" data-feedback-id="tasks.etiquetas.familias.nueva" data-feedback-label="Nueva familia">+ Nueva familia</button></main>`}
function familyCard(f){const ls=tab().labels.filter(l=>l.family===f.id&&!l.archived);return `<div class="family-card"><div class="family-card-head"><span class="dot" style="background:${f.color}"></span><strong>${esc(f.name)}</strong><div class="spacer"></div><button class="ghost" data-edit-family="${f.id}" data-feedback-id="tasks.etiquetas.familias.editar" data-feedback-label="Editar familia">Editar</button></div><div class="chips">${ls.map(l=>`<span class="chip" style="background:${f.color}">${esc(l.text)}</span>`).join('')}</div><button class="ghost" style="margin-top:10px" data-new-label="${f.id}" data-feedback-id="tasks.etiquetas.familias.nueva_etiqueta" data-feedback-label="Nueva etiqueta">+ etiqueta</button></div>`}
function fab(){if(state.view==='labels')return'';return `<button class="fab" id="fab" data-feedback-id="tasks.global.anadir" data-feedback-label="Añadir">+</button>`}
function bindV1(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;state.view='projects';state.currentProject=null;state.search='';state.filters={};save();render()});
 document.querySelectorAll('[data-open-project]').forEach(b=>b.onclick=()=>{state.currentProject=b.dataset.openProject;state.view='project';state.search='';state.filters={};render()});
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.search='';state.filters={};if(state.view!=='project')state.currentProject=null;render()});
 document.querySelectorAll('[data-toggle-task]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.toggleTask));
 document.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>openTaskEditor(b.dataset.editTask));

 document.querySelectorAll('[data-edit-family]').forEach(b=>b.onclick=()=>openFamilyEditor(b.dataset.editFamily));
 document.querySelectorAll('[data-new-label]').forEach(b=>b.onclick=()=>openNewLabel(b.dataset.newLabel));
 const s=document.getElementById('searchInput');if(s)s.oninput=e=>{state.search=e.target.value;save();rerenderContentSoon()};
 const f=document.getElementById('filterBtn');if(f)f.onclick=openFilters; const fn=document.getElementById('filterNav');if(fn)fn.onclick=openFilters;
 const cf=document.getElementById('clearFilters');if(cf)cf.onclick=()=>{state.filters={};save();render()};
 const fab=document.getElementById('fab');if(fab)fab.onclick=()=>state.view==='project'||state.view==='inbox'?openTaskEditor():openProjectEditor();
 const back=document.getElementById('backBtn');if(back)back.onclick=()=>{state.view='projects';state.currentProject=null;state.search='';state.filters={};render()};
 const nf=document.getElementById('newFamily');if(nf)nf.onclick=()=>openFamilyEditor();
 const mb=document.getElementById('moreBtn');if(mb)mb.onclick=()=>document.getElementById('kebab').classList.toggle('show');
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleTopAction(b.dataset.action));}
let rr;function rerenderContentSoon(){clearTimeout(rr);rr=setTimeout(()=>render(),110)}
function toggleTask(id){const p=project();const t=p.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render();toast(t.done?'Tarea completada':'Tarea reabierta')}}
/* Hoja: la del kit común (IkisaiKit.openSheet) con las condiciones de Tasks (docs/tasks/UI_KIT.md):
   - openSheet(html) inserta de forma síncrona; con una hoja abierta sustituye título y contenido en el sitio (sin cerrar,
     sin llamar a los envoltorios de closeSheet y conservando #sheetBack.show y el foco atrapado);
   - #sheet es el cuerpo que desplaza y donde los módulos insertan; el título (.sheettitle) sigue dentro de #sheet y el de la
     cabecera del kit queda para lectores de pantalla (hideTitle); #closeDialog es el botón de cerrar del kit;
   - closeSheet(e) con evento solo cierra si e.target es #sheetBack; sin evento cierra siempre y de forma síncrona. Si la hoja
     se cierra desde el kit (fondo, botón, Escape), se llama a closeSheet() para que sus envoltorios suelten borradores;
   - cerrada, queda un #sheetBack vacío y oculto (sin show) para quien lo consulta;
   - el contenido lleva .ikisai-legacy: el CSS del kit pinta el marco de la hoja y no su contenido heredado. */
let sheetKit=null,sheetKitClosing=false;
function sheetPlaceholder(){if(!document.getElementById('sheetBack')){const p=document.createElement('div');p.id='sheetBack';p.hidden=true;document.body.appendChild(p)}}
function sheetKitLayer(){let l=document.getElementById('kitLayer');if(!l){l=document.createElement('div');l.id='kitLayer';l.className='ikisai-kit';l.style.display='contents';document.body.appendChild(l)}return l}
function openSheet(html){
 const t=document.createElement('template');t.innerHTML=html;const title=t.content.querySelector('.sheettitle')?.textContent.trim()||'Opciones';
 if(sheetKit&&sheetKit.isOpen()){const body=sheetKit.body,inside=sheetKit.panel.contains(document.activeElement);sheetKit.setTitle(title);body.replaceChildren(t.content);body.scrollTop=0;if(!inside||!document.contains(document.activeElement))sheetKit.panel.focus({preventScroll:true});return}
 document.getElementById('sheetBack')?.remove();
 sheetKit=IkisaiKit.openSheet({title,hideTitle:true,body:t.content,closeLabel:'Cerrar ventana',backAttrs:{id:'sheetBack'},bodyAttrs:{id:'sheet',class:'ikisai-legacy'},closeAttrs:{id:'closeDialog'},
  onClose:reason=>{if(reason!=='close')return;sheetKit=null;sheetPlaceholder();if(!sheetKitClosing)closeSheet()}});
 sheetKitLayer().appendChild(sheetKit.element)}
function closeSheet(e){if(e&&e.target!==document.getElementById('sheetBack'))return;if(!sheetKit)return;const s=sheetKit;sheetKitClosing=true;try{s.close(true)}finally{sheetKitClosing=false}}
/* Escape con una hoja abierta la cierra a ella sola: se atiende antes que la navegación, la selección en lote y la paleta
   (que, si está abierta encima, se cierra primero ella). */
window.addEventListener('keydown',e=>{if(e.key!=='Escape'||!sheetKit||document.getElementById('palette'))return;e.preventDefault();e.stopImmediatePropagation();closeSheet()},true);
function openTaskEditor(id,selectedOverride=null,valsOverride=null){let p=project();if(!p){const ib=tab().projects.find(x=>x.system==='inbox');p=ib;state.currentProject=ib.id;state.view='inbox'}const base=id?p.tasks.find(x=>x.id===id):{text:'',note:'',done:false,priority:'normal',due:'',labels:[...(p.ownLabels||[])],owner:null};const t=valsOverride?{...base,...valsOverride}:base;let selected=selectedOverride?[...selectedOverride]:[...(base.labels||[])];
 openSheet(`<h2 class="sheettitle">${id?'Editar tarea':'Nueva tarea'}</h2><div class="field"><label>Tarea</label><input id="teText" value="${esc(t.text)}" placeholder="¿Qué hay que hacer?" data-feedback-id="tasks.editor_tarea.campos.texto" data-feedback-label="Tarea"></div><div class="field"><label>Nota</label><textarea id="teNote" placeholder="Detalle opcional" data-feedback-id="tasks.editor_tarea.campos.nota" data-feedback-label="Nota">${esc(t.note||'')}</textarea></div><div class="row"><div class="field"><label>Prioridad</label><select id="tePriority" data-feedback-id="tasks.editor_tarea.campos.prioridad" data-feedback-label="Prioridad"><option value="normal">Normal</option><option value="high">Alta</option><option value="critical">Crítica</option></select></div><div class="field"><label>Fecha objetivo</label><input id="teDue" type="date" value="${esc(t.due||'')}" data-feedback-id="tasks.editor_tarea.campos.fecha" data-feedback-label="Fecha objetivo"></div></div><div class="field"><label>Etiquetas</label><div class="chips">${chips(selected)}</div><button class="ghost" id="editLabelsBtn" style="margin-top:9px" data-feedback-id="tasks.editor_tarea.etiquetas.editar" data-feedback-label="Editar etiquetas">Editar etiquetas</button></div><div class="actions">${id?`<button class="danger" id="deleteTaskBtn" data-feedback-id="tasks.editor_tarea.eliminar" data-feedback-label="Enviar a papelera">Papelera</button>`:''}<button class="primary" id="saveTaskBtn" data-feedback-id="tasks.editor_tarea.guardar" data-feedback-label="Guardar">Guardar</button></div>`);
 document.getElementById('tePriority').value=t.priority||'normal';document.getElementById('editLabelsBtn').onclick=()=>{const vals={text:document.getElementById('teText').value,note:document.getElementById('teNote').value,priority:document.getElementById('tePriority').value,due:document.getElementById('teDue').value};openLabelPicker(selected,x=>openTaskEditor(id,x,vals))};
 document.getElementById('saveTaskBtn').onclick=()=>saveTask(id,selected);if(id)document.getElementById('deleteTaskBtn').onclick=()=>{base.deleted=true;base.deletedAt=new Date().toISOString();save();closeSheet();render();toast('Tarea enviada a papelera')};}
function saveTask(id,selected){const p=project();const textv=document.getElementById('teText').value.trim();if(!textv)return toast('Escribe una tarea');const data={text:textv,note:document.getElementById('teNote').value.trim(),priority:document.getElementById('tePriority').value,due:document.getElementById('teDue').value,labels:selected,owner:selected.find(x=>isPersonFamily(label(x)?.family))||null};if(id)Object.assign(p.tasks.find(x=>x.id===id),data);else p.tasks.push({id:'t'+Date.now(),done:false,...data});save();closeSheet();render();toast(id?'Tarea actualizada':'Tarea creada')}
function openLabelPicker(selected,cb){const usedByProject=new Set((project()?.tasks||[]).flatMap(t=>t.labels||[]));openSheet(`<h2 class="sheettitle">Etiquetas</h2><p class="subtitle">Primero las usadas en este proyecto; después, las disponibles en la pestaña.</p>${tab().families.map(f=>{const ls=tab().labels.filter(l=>l.family===f.id&&!l.archived);if(!ls.length)return'';const ordered=[...ls].sort((a,b)=>Number(usedByProject.has(b.id))-Number(usedByProject.has(a.id)));return `<div class="family"><div class="familyhead"><span class="dot" style="background:${f.color}"></span><span class="familyname">${esc(f.name)}</span></div>${ordered.map(l=>`<button class="filterchip ${selected.includes(l.id)?'on':''}" style="color:${f.color}" data-pick-label="${l.id}" data-feedback-id="tasks.selector_etiquetas.lista.etiqueta" data-feedback-label="Etiqueta">${esc(labelName(l))}</button>`).join('')}</div>`}).join('')}<div class="actions"><button class="primary" id="labelsDone" data-feedback-id="tasks.selector_etiquetas.aplicar" data-feedback-label="Aplicar">Aplicar</button></div>`);document.querySelectorAll('[data-pick-label]').forEach(b=>b.onclick=()=>{const id=b.dataset.pickLabel;if(selected.includes(id))selected=selected.filter(x=>x!==id);else selected=[...selected,id];b.classList.toggle('on')});document.getElementById('labelsDone').onclick=()=>cb(selected)}
function openProjectEditor(id,selectedOverride=null,valsOverride=null){const base=id?tab().projects.find(x=>x.id===id):{title:'',note:'',status:'active',priority:'normal',due:'',ownLabels:[]};const p=valsOverride?{...base,...valsOverride}:base;let selected=selectedOverride?[...selectedOverride]:[...(base.ownLabels||[])];openSheet(`<h2 class="sheettitle">${id?'Editar proyecto':'Nuevo proyecto'}</h2><div class="field"><label>Nombre</label><input id="peTitle" value="${esc(p.title)}" placeholder="Nombre del proyecto" data-feedback-id="tasks.editor_proyecto.campos.nombre" data-feedback-label="Nombre del proyecto"></div><div class="field"><label>Nota</label><textarea id="peNote" data-feedback-id="tasks.editor_proyecto.campos.nota" data-feedback-label="Nota">${esc(p.note||'')}</textarea></div><div class="row"><div class="field"><label>Estado</label><select id="peStatus" data-feedback-id="tasks.editor_proyecto.campos.estado" data-feedback-label="Estado"><option value="active">Activo</option><option value="paused">Pausado</option><option value="archived">Archivado</option></select></div><div class="field"><label>Prioridad</label><select id="pePriority" data-feedback-id="tasks.editor_proyecto.campos.prioridad" data-feedback-label="Prioridad"><option value="normal">Normal</option><option value="high">Alta</option><option value="critical">Crítica</option></select></div></div><div class="field"><label>Fecha objetivo</label><input id="peDue" type="date" value="${esc(p.due||'')}" data-feedback-id="tasks.editor_proyecto.campos.fecha" data-feedback-label="Fecha objetivo"></div><div class="field"><label>Etiquetas propias</label><div class="chips">${chips(selected)}</div><button class="ghost" id="editProjectLabels" style="margin-top:9px" data-feedback-id="tasks.editor_proyecto.etiquetas.editar" data-feedback-label="Editar etiquetas">Editar etiquetas</button><p class="small muted">Se proponen automáticamente al crear nuevas tareas.</p></div><div class="actions">${id&&!base.system?`<button class="danger" id="deleteProjectBtn" data-feedback-id="tasks.editor_proyecto.eliminar" data-feedback-label="Enviar a papelera">Papelera</button>`:''}<button class="primary" id="saveProjectBtn" data-feedback-id="tasks.editor_proyecto.guardar" data-feedback-label="Guardar">Guardar</button></div>`);document.getElementById('peStatus').value=p.status||'active';document.getElementById('pePriority').value=p.priority||'normal';document.getElementById('editProjectLabels').onclick=()=>{const vals={title:document.getElementById('peTitle').value,note:document.getElementById('peNote').value,status:document.getElementById('peStatus').value,priority:document.getElementById('pePriority').value,due:document.getElementById('peDue').value};openLabelPicker(selected,x=>openProjectEditor(id,x,vals))};document.getElementById('saveProjectBtn').onclick=()=>{const name=document.getElementById('peTitle').value.trim();if(!name)return toast('Pon un nombre');const d={title:name,note:document.getElementById('peNote').value.trim(),status:document.getElementById('peStatus').value,priority:document.getElementById('pePriority').value,due:document.getElementById('peDue').value,ownLabels:selected};if(id)Object.assign(base,d);else tab().projects.push({id:'p'+Date.now(),tasks:[],...d});save();closeSheet();render();toast(id?'Proyecto actualizado':'Proyecto creado')};if(id&&!base.system)document.getElementById('deleteProjectBtn').onclick=()=>{base.deleted=true;base.deletedAt=new Date().toISOString();save();closeSheet();state.view='projects';state.currentProject=null;render();toast('Proyecto enviado a papelera')}}
function filtersV1(){openSheet(`<h2 class="sheettitle">Filtrar</h2><p class="subtitle">Los filtros se combinan entre familias.</p><div class="filterfamily"><h4>Estado</h4><button class="filterchip ${(state.filters._state||[]).includes('pending')?'on':''}" data-state-filter="pending" data-feedback-id="tasks.filtros.estado.pendientes" data-feedback-label="Pendientes">Pendientes</button><button class="filterchip ${(state.filters._state||[]).includes('done')?'on':''}" data-state-filter="done" data-feedback-id="tasks.filtros.estado.completadas" data-feedback-label="Completadas">Completadas</button></div>${tab().families.map(f=>{const ls=tab().labels.filter(l=>l.family===f.id&&!l.archived);if(!ls.length)return'';return `<div class="filterfamily"><h4><span class="dot" style="background:${f.color};display:inline-block;margin-right:7px"></span>${esc(f.name)}</h4>${ls.map(l=>`<button class="filterchip ${(state.filters[f.id]||[]).includes(l.id)?'on':''}" style="color:${f.color}" data-filter="${f.id}|${l.id}" data-feedback-id="tasks.filtros.etiquetas.etiqueta" data-feedback-label="Filtrar por etiqueta">${esc(labelName(l))}</button>`).join('')}</div>`}).join('')}<div class="actions"><button class="ghost" id="clearFilterSheet" data-feedback-id="tasks.filtros.limpiar" data-feedback-label="Limpiar">Limpiar</button><button class="primary" id="applyFilterSheet" data-feedback-id="tasks.filtros.aplicar" data-feedback-label="Aplicar">Aplicar</button></div>`);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const [fid,lid]=b.dataset.filter.split('|');state.filters[fid]=state.filters[fid]||[];state.filters[fid]=state.filters[fid].includes(lid)?state.filters[fid].filter(x=>x!==lid):[...state.filters[fid],lid];b.classList.toggle('on')});document.getElementById('clearFilterSheet').onclick=()=>{state.filters={};closeSheet();save();render()};document.getElementById('applyFilterSheet').onclick=()=>{closeSheet();save();render()}}
function openFamilyEditor(id){const f=id?family(id):{name:'',color:'#68704a'};openSheet(`<h2 class="sheettitle">${id?'Editar familia':'Nueva familia'}</h2><div class="field"><label>Nombre</label><input id="feName" value="${esc(f.name)}" data-feedback-id="tasks.editor_familia.campos.nombre" data-feedback-label="Nombre de la familia"></div><div class="field"><label>Color</label><input id="feColor" type="color" value="${f.color}" style="height:54px;padding:6px" data-feedback-id="tasks.editor_familia.campos.color" data-feedback-label="Color"></div><div class="actions"><button class="primary" id="saveFamily" data-feedback-id="tasks.editor_familia.guardar" data-feedback-label="Guardar">Guardar</button></div>`);document.getElementById('saveFamily').onclick=()=>{const name=document.getElementById('feName').value.trim();if(!name)return toast('Pon un nombre');if(id){f.name=name;f.color=document.getElementById('feColor').value}else tab().families.push({id:'f'+Date.now(),name,color:document.getElementById('feColor').value});save();closeSheet();render();toast('Familia guardada')}}
function openNewLabel(fid){openSheet(`<h2 class="sheettitle">Nueva etiqueta</h2><div class="field"><label>${esc(family(fid)?.name||'Familia')}</label><input id="nlText" placeholder="Texto de la etiqueta" data-feedback-id="tasks.nueva_etiqueta.campos.texto" data-feedback-label="Texto de la etiqueta"></div><div class="actions"><button class="primary" id="saveNewLabel" data-feedback-id="tasks.nueva_etiqueta.crear" data-feedback-label="Crear">Crear</button></div>`);document.getElementById('saveNewLabel').onclick=()=>{const textv=document.getElementById('nlText').value.trim();if(!textv)return;const duplicate=tab().labels.find(l=>l.family===fid&&l.text.toLowerCase()===textv.toLowerCase()&&!l.archived);if(duplicate)return toast('Esa etiqueta ya existe');tab().labels.push({id:'l'+Date.now(),text:textv,family:fid,parent:null,archived:false});save();closeSheet();render();toast('Etiqueta creada')}}

function fmtDate(d){try{return new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'))}catch(e){return d}}

const legacyBind=bindV1, legacyMain=mainV1, legacyFilters=filtersV1;
const STORAGE='ikisai_p5a_demo';
function uid(prefix){return prefix+crypto.randomUUID()}
function normalize(){
 state.schemaVersion=2;state.history||=[];
 for(const scope of state.tabs){
  if(!scope.restricted&&!scope.projects.some(p=>p.system==='inbox'))scope.projects.unshift({id:uid('p'),system:'inbox',title:'Entrada',note:'Captura rápida. Clasificar después.',status:'active',ownLabels:[],tasks:[]});
  for(const p of scope.projects){p.order??=(scope.projects.indexOf(p)+1)*1024;p.version||=1;p.attachments||=[];p.tasks.forEach((t,i)=>{t.parentId||=null;t.order??=(i+1)*1024;t.version||=1;t.attachments||=[];if(t.parentId&&!p.tasks.some(x=>x.id===t.parentId&&!x.parentId))t.parentId=null});}
 }
 if(state.view==='inbox')state.view='project';
}
function save(){normalize();state.version=(state.version||0)+1;try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){toast('No se pudo guardar. Exporta una copia desde el menú.')}}
function record(action,ids){state.history.push({id:uid('h'),at:new Date().toISOString(),action,ids});if(state.history.length>250)state.history.shift()}
function touch(t){t.version=(t.version||0)+1;t.updatedAt=new Date().toISOString()}
function children(p,id){return p.tasks.filter(t=>!t.deleted&&t.parentId===id).sort((a,b)=>a.order-b.order)}
function status(p,t){const c=children(p,t.id);return c.length?(c.every(x=>x.done)?'done':c.some(x=>x.done)?'mixed':'pending'):t.done?'done':'pending'}
function leaves(p){return p.tasks.filter(t=>!t.deleted&&!children(p,t.id).length)}
function progress(p){const list=leaves(p);return list.length?Math.round(100*list.filter(t=>t.done).length/list.length):0}
function pending(p){return leaves(p).filter(t=>!t.done).length}
function syncParent(p,id){const t=p.tasks.find(t=>t.id===id);if(!t)return;const c=children(p,id);if(c.length){const done=c.every(x=>x.done);if(t.done!==done){t.done=done;touch(t)}}}
function syncAll(p){p.tasks.filter(t=>!t.parentId).forEach(t=>syncParent(p,t.id))}
function taskLocation(id){for(const p of tab().projects){const t=p.tasks.find(t=>t.id===id);if(t)return{p,t}}}
function filteredTasks(p){return p.tasks.filter(t=>{
 if(t.deleted)return false;const st=state.filters?._state||[],done=status(p,t)==='done';if(st.length&&!((st.includes('pending')&&!done)||(st.includes('done')&&done)))return false;
 const q=state.search.trim().toLowerCase();if(q&&!(t.text+' '+(t.note||'')).toLowerCase().includes(q)&&!(t.labels||[]).some(id=>label(id)?.text.toLowerCase().includes(q)))return false;
 return filterGroups(state.filters).every(([f,ids])=>['_state','_availability'].includes(f)||!ids.length||(f==='_project'?ids.includes(p.id):ids.some(id=>(t.labels||[]).includes(id))));
})}
function treeRows(p){const found=new Set(filteredTasks(p).map(t=>t.id));const active=p.tasks.filter(t=>!t.deleted);const rows=[];
 for(const t of active.filter(t=>!t.parentId).sort((a,b)=>a.order-b.order)){const cs=children(p,t.id);if(found.has(t.id)||cs.some(c=>found.has(c.id))){rows.push(taskRow(t,p,!found.has(t.id)));for(const c of cs)if(found.has(c.id)||found.has(t.id)&&!state.search&&!Object.values(state.filters).some(v=>v.length))rows.push(taskRow(c,p))}}
 return rows.join('')||'<div class="empty">No hay tareas que coincidan.</div>';
}
function taskRow(t,p=project(),context=false){const s=status(p,t),cs=children(p,t.id),n=cs.filter(x=>x.done).length;return `<article class="task ${s==='done'?'done':''} ${t.parentId?'child':''} ${context?'context':''}" data-row="${t.id}" data-project="${p.id}" data-feedback-id="tasks.proyecto.tareas.fila" data-feedback-label="Tarea"><button class="draghandle" data-drag="${t.id}" aria-label="Arrastrar ${esc(t.text)}" title="Arrastrar para mover" data-feedback-id="tasks.proyecto.tareas.arrastrar" data-feedback-label="Arrastrar tarea">⠿</button><button class="check ${s==='mixed'?'mixed':''}" data-toggle-task="${t.id}" role="checkbox" aria-checked="${s==='mixed'?'mixed':s==='done'}" aria-label="Completar ${esc(t.text)}" data-feedback-id="tasks.proyecto.tareas.completar" data-feedback-label="Completar tarea">${s==='done'?'✓':s==='mixed'?'−':''}</button><button class="taskbody" data-edit-task="${t.id}" data-feedback-id="tasks.proyecto.tareas.abrir" data-feedback-label="Abrir tarea"><span class="tasktext">${esc(t.text)}</span>${t.note?`<span class="tasknote">${esc(t.note)}</span>`:''}<span class="chips taskchips">${chips(t.labels||[])}</span>${cs.length||t.due||t.priority!=='normal'?`<span class="taskmeta">${cs.length?`<span>${n}/${cs.length} hijas</span>`:''}${t.priority&&t.priority!=='normal'?`<span class="priority">${t.priority==='critical'?'Crítica':'Alta'}</span>`:''}${t.due?`<span>${fmtDate(t.due)}</span>`:''}</span>`:''}</button><button class="taskmenu" data-task-menu="${t.id}" aria-label="Opciones de ${esc(t.text)}" data-feedback-id="tasks.proyecto.tareas.opciones" data-feedback-label="Opciones de la tarea">⋮</button></article>`}

function toggleTask(id){const loc=taskLocation(id);if(!loc)return;const {p,t}=loc,done=status(p,t)!=='done';const c=children(p,id);for(const x of c.length?c:[t]){x.done=done;touch(x)}syncAll(p);record(done?'complete':'reopen',[id]);save();render()}
// Una operación de movimiento protege profundidad, ciclos y unidad padre/hijas.
function moveTask(id,destId,parentId=null,beforeId=null){
 const loc=taskLocation(id),dest=tab().projects.find(p=>p.id===destId&&!p.deleted&&p.status!=='archived');if(!loc||!dest)return false;
 const {p,t}=loc,oldParent=t.parentId,c=children(p,id);const parent=parentId?dest.tasks.find(x=>x.id===parentId&&!x.deleted):null;
 if(parentId&&(!parent||parent.parentId||parent.id===id||c.length)){toast('Solo un nivel: una tarea con hijas no puede anidarse.');return false}
 const group=[t,...p.tasks.filter(x=>x.parentId===id)];
 if(p!==dest){p.tasks=p.tasks.filter(x=>!group.includes(x));dest.tasks.push(...group)}
 t.parentId=parentId;const peers=dest.tasks.filter(x=>!x.deleted&&x!==t&&(x.parentId||null)===parentId).sort((a,b)=>a.order-b.order);
 const pos=beforeId?peers.findIndex(x=>x.id===beforeId):-1;
 const lower=pos===0?0:pos>0?peers[pos-1].order:peers.at(-1)?.order||0,upper=pos>=0?peers[pos].order:lower+2048;t.order=(lower+upper)/2;
 if(upper-lower<1e-6){const list=peers.slice();list.splice(pos<0?list.length:pos,0,t);list.forEach((x,i)=>x.order=(i+1)*1024)}
 group.forEach(touch);if(oldParent)syncParent(p,oldParent);syncAll(dest);record('move',[id,destId,parentId]);if(!save()){render();return false}render();return true;
}
function deleteTask(id){const {p,t}=taskLocation(id);const batch=uid('del');[t,...children(p,id)].forEach(x=>{x.deleted=true;x.deleteBatch=batch;x.deletedAt=new Date().toISOString();touch(x)});syncAll(p);record('delete',[id]);save();closeSheet();render();toast('En papelera. Puedes restaurarla.');}

 document.querySelectorAll('[data-toggle-label]').forEach(b=>b.onclick=()=>{const l=label(b.dataset.toggleLabel);l.archived=!l.archived;save();render()});document.querySelectorAll('[data-toggle-family]').forEach(b=>b.onclick=()=>{const f=family(b.dataset.toggleFamily);f.archived=!f.archived;tab().labels.filter(l=>l.family===f.id).forEach(l=>{if(f.archived){l.beforeFamilyArchive=l.archived;l.archived=true}else{l.archived=!!l.beforeFamilyArchive;delete l.beforeFamilyArchive}});save();render()});

function familyCard(f){const ls=tab().labels.filter(l=>l.family===f.id);return `<div class="family-card"><div class="family-card-head"><span class="dot" style="background:${f.color}"></span><strong>${esc(f.name)}${f.archived?' · archivada':''}</strong><div class="spacer"></div><button class="ghost" data-edit-family="${f.id}" data-feedback-id="tasks.etiquetas.familias.editar" data-feedback-label="Editar familia">Editar</button><button class="ghost" data-toggle-family="${f.id}" aria-label="Archivar o restaurar familia" data-feedback-id="tasks.etiquetas.familias.archivar" data-feedback-label="Archivar o restaurar familia">${f.archived?'↶':'↓'}</button></div><div class="chips">${ls.map(l=>`<button class="chip ${l.archived?'archivedchip':''}" style="background:${f.color}" data-toggle-label="${l.id}" ${f.archived?'disabled':''} title="${l.archived?'Restaurar':'Archivar'} etiqueta" data-feedback-id="tasks.etiquetas.etiqueta.archivar" data-feedback-label="Archivar o restaurar etiqueta">${esc(l.text)} ${l.archived?'↶':'×'}</button>`).join('')}</div>${!f.archived?`<button class="ghost" data-new-label="${f.id}" style="margin-top:10px" data-feedback-id="tasks.etiquetas.familias.nueva_etiqueta" data-feedback-label="Nueva etiqueta">+ etiqueta</button>`:''}</div>`}
function showTrash(){const ps=tab().projects.filter(p=>p.deleted),ts=tab().projects.flatMap(p=>p.tasks.filter(t=>t.deleted).map(t=>({t,p})));openSheet(`<h2 class="sheettitle">Papelera</h2>${!ps.length&&!ts.length?'<div class="empty">La papelera está vacía.</div>':''}${ps.map(p=>`<div class="suggestion"><span>${esc(p.title)}</span><button data-restore-project="${p.id}" data-feedback-id="tasks.papelera.proyectos.restaurar" data-feedback-label="Restaurar proyecto">Restaurar</button></div>`).join('')}${ts.map(({t,p})=>`<div class="suggestion"><span>${esc(t.text)}<small class="muted"> · ${esc(p.title)}</small></span><button data-restore-task="${p.id}|${t.id}" data-feedback-id="tasks.papelera.tareas.restaurar" data-feedback-label="Restaurar tarea">Restaurar</button></div>`).join('')}`);document.querySelectorAll('[data-restore-project]').forEach(b=>b.onclick=()=>{const p=tab().projects.find(x=>x.id===b.dataset.restoreProject);p.deleted=false;save();render();showTrash()});document.querySelectorAll('[data-restore-task]').forEach(b=>b.onclick=()=>{const [pid,id]=b.dataset.restoreTask.split('|'),p=tab().projects.find(p=>p.id===pid),t=p.tasks.find(t=>t.id===id),parent=p.tasks.find(x=>x.id===t.parentId),batch=t.deleteBatch;for(const x of p.tasks)if(x===t||batch&&x.deleteBatch===batch){x.deleted=false;delete x.deleteBatch;delete x.deletedAt;touch(x)}if(parent?.deleted){parent.deleted=false;delete parent.deleteBatch;delete parent.deletedAt}syncAll(p);record('restore',[id]);save();render();showTrash()})}
function handleTopAction(a){document.getElementById('kebab').classList.remove('show');if(a==='reset'){openSheet('<h2 class="sheettitle">Restablecer demo</h2><p>Se borrarán los cambios locales. Puedes exportarlos antes desde el menú.</p><button class="danger" id="confirmReset" data-feedback-id="tasks.restablecer_demo.confirmar" data-feedback-label="Restablecer">Restablecer</button>');document.getElementById('confirmReset').onclick=()=>{state=structuredClone(demo);normalize();save();closeSheet();render()}}if(a==='archive')showArchive();if(a==='trash')showTrash();if(a==='history')openSheet(`<h2 class="sheettitle">Historial local</h2>${state.history.slice().reverse().map(h=>`<div class="suggestion"><span>${esc(h.action)}</span><small>${new Date(h.at).toLocaleString('es-ES')}</small></div>`).join('')||'<p>Sin cambios registrados.</p>'}`);if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Ikisai_tareas_datos.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
// Pointer Events: mismo gesto en ratón, lápiz y pantalla táctil, sin dependencias.
let drag=null,dragScrollFrame=null;
function beginDrag(e){if(e.button!==0)return;e.preventDefault();const row=e.currentTarget.closest('[data-row]');drag={id:row.dataset.row,x:e.clientX,y:e.clientY,started:false,target:null,pointerId:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId);document.addEventListener('pointermove',dragMove,{passive:false});document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragCancel);}
function startDrag(){drag.started=true;document.body.classList.add('dragging');const ghost=document.createElement('div');ghost.id='dragGhost';ghost.textContent=taskLocation(drag.id).t.text;document.body.appendChild(ghost);const rail=document.createElement('div');rail.id='moveRail';rail.innerHTML=`<span>Mover a proyecto</span><div>${tab().projects.filter(p=>!p.deleted&&p.status!=='archived').map(p=>`<button data-drop-project="${p.id}" data-feedback-id="tasks.arrastre.proyectos.soltar" data-feedback-label="Mover a proyecto">${esc(p.title)}</button>`).join('')}</div>`;document.body.appendChild(rail);document.querySelector(`[data-row="${drag.id}"]`)?.classList.add('drag-source');dragScrollFrame=requestAnimationFrame(autoScroll)}
function autoScroll(){if(!drag?.started)return;const y=drag.y;let delta=y>innerHeight-150?10:y<190?-10:0;if(delta){window.scrollBy(0,delta);updateDragTarget(drag.x,y)}dragScrollFrame=requestAnimationFrame(autoScroll)}
function dragMove(e){if(!drag)return;e.preventDefault();if(!drag.started&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)startDrag();drag.x=e.clientX;drag.y=e.clientY;if(!drag.started)return;const ghost=document.getElementById('dragGhost');ghost.style.left=Math.min(e.clientX+12,innerWidth-220)+'px';ghost.style.top=(e.clientY+16)+'px';updateDragTarget(e.clientX,e.clientY)}
function updateDragTarget(x,y){document.querySelectorAll('.drop-before,.drop-after,.drop-child,.drop-project').forEach(e=>e.classList.remove('drop-before','drop-after','drop-child','drop-project'));drag.target=null;const el=document.elementFromPoint(x,y);if(!el)return;const dest=el.closest('[data-drop-project]'),root=el.closest('[data-root-project]'),row=el.closest('[data-row]');if(dest){drag.target={dest:dest.dataset.dropProject,parent:null,before:null};dest.classList.add('drop-project');return}if(root){drag.target={dest:root.dataset.rootProject,parent:null,before:null};root.classList.add('drop-project');return}if(row&&row.dataset.row!==drag.id){const {p,t}=taskLocation(row.dataset.row),r=row.getBoundingClientRect(),rel=(y-r.top)/r.height;const child=rel>.25&&rel<.75&&x>r.left+90;
 if(child){if(t.parentId||children(taskLocation(drag.id).p,drag.id).length)return;drag.target={dest:p.id,parent:t.id,before:null};row.classList.add('drop-child')}
 else{const peers=p.tasks.filter(a=>!a.deleted&&(a.parentId||null)===(t.parentId||null)).sort((a,b)=>a.order-b.order),next=peers[peers.indexOf(t)+1];drag.target={dest:p.id,parent:t.parentId||null,before:rel<.5?t.id:next?.id||null};row.classList.add(rel<.5?'drop-before':'drop-after')}
 }}
function dragEnd(){const d=drag;dragCancel();if(d?.started&&d.target&&moveTask(d.id,d.target.dest,d.target.parent,d.target.before))toast('Tarea movida')}
function dragCancel(){cancelAnimationFrame(dragScrollFrame);document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragEnd);document.removeEventListener('pointercancel',dragCancel);document.getElementById('dragGhost')?.remove();document.getElementById('moveRail')?.remove();document.body.classList.remove('dragging');document.querySelectorAll('.drag-source,.drop-before,.drop-after,.drop-child,.drop-project').forEach(e=>e.classList.remove('drag-source','drop-before','drop-after','drop-child','drop-project'));drag=null}
normalize();
// Ejemplo de jerarquía solo en una demo nueva; no altera las tareas guardadas de v1.
if(!localStorage.getItem(STORAGE)){const p=state.tabs[0].projects.find(p=>p.id==='p1');p.tasks.push({id:'t1a',text:'Comprobar marco y medidas',note:'Antes de pedir la puerta.',parentId:'t1',order:1024,done:true,priority:'normal',labels:['juan','carp'],owner:'juan',version:1,attachments:[]},{id:'t1b',text:'Montar hoja y herrajes',note:'',parentId:'t1',order:2048,done:false,priority:'normal',labels:['carp'],version:1,attachments:[]});syncAll(p)}
